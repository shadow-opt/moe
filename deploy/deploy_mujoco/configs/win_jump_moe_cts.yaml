manifest_path: "{LEGGED_GYM_ROOT_DIR}/logs/win_jump_moe_cts/exported/best/manifest.json"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/aaaaa_fixed/z2/urdf/scene_terrain.xml"
simulation_dt: 0.0005
control_decimation: 40
duration_s: 20.0
contact_threshold_n: 5.0
fall_height_m: 0.16
